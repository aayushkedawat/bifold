# What the definition of done claims, enforced.
#
# The package is analysed, formatted and tested on every push, and both
# platform targets are built: iOS because that is where the plugin has a
# native implementation, Android because that is where it must degrade to
# FoldInfo.unsupported without a word in the console.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "stable": pubspec claims only this version has actually
  # been exercised, and CI should not quietly contradict the README.
  FLUTTER_VERSION: 3.44.4

jobs:
  package:
    name: Analyse, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # public_member_api_docs and comment_references are on, so this also
      # catches undocumented public members and doc references that would
      # render as plain text instead of links.
      - name: Analyse
        run: flutter analyze

      # Scoped to sources so a stray generated file under build/ cannot fail
      # the run.
      - name: Check formatting
        run: >
          dart format --output=none --set-exit-if-changed
          lib test example/lib example/test example/integration_test

      # Includes test/readme/readme_examples_test.dart, which compile-checks
      # the README snippets that have been transcribed into it. It cannot
      # detect a snippet nobody copied, so adding a README example means
      # adding it there too.
      - name: Test
        run: flutter test

      # The example's own tests, including the three downstream consumers that
      # are the package's proof that no app needs a Platform.isIOS branch.
      # These used to run only on a developer's machine.
      - name: Test the example
        run: flutter test
        working-directory: example

      - name: Analyse the example
        run: flutter analyze
        working-directory: example

      # Catches a packaging regression -- a native source left out of the
      # archive, a malformed pubspec -- before it reaches pub.dev, where a
      # published version cannot be taken back.
      - name: Check the package publishes cleanly
        run: flutter pub publish --dry-run

      # `pub publish --dry-run` reports 0 warnings while shipping whatever is
      # in the tree -- a stray 9 MB screen recording once made the archive 7 MB
      # against a ~100 KB lib/. .pubignore keeps media and the example out;
      # this makes a regression fail the build rather than reach pub.dev.
      - name: Check the archive stays small
        run: |
          size=$(flutter pub publish --dry-run 2>&1 \
            | sed -n 's/.*Total compressed archive size: \(.*\)\./\1/p')
          echo "archive: $size"
          case "$size" in
            *MB*)
              whole=${size%%.*}
              whole=${whole%% *}
              if [ "${whole:-0}" -ge 2 ]; then
                echo "::error::Archive is $size. Something large is being" \
                  "published -- check .pubignore."
                exit 1
              fi
              ;;
          esac

  android:
    name: Build the example for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Builds the example against the plugin's own Android module, which has
      # existed since 0.2.0. Graceful degradation where there is no native
      # side at all is covered by the Dart tests instead, which assert that a
      # MissingPluginException resolves to FoldInfo.none.
      - name: Build
        run: flutter build apk --debug
        working-directory: example

      # The plugin's own Kotlin tests. They run from the example's Gradle
      # project because that is what resolves the plugin as a module.
      - name: Test the Kotlin adapter
        run: ./gradlew :bifold:test --console=plain
        working-directory: example/android

  ios:
    name: Build the example for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The plugin ships a Package.swift as well as a podspec; match how it is
      # built locally rather than silently falling back to CocoaPods.
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      # Device build with signing off: --simulator wants a Flutter.framework
      # carrying both arm64 and x86_64, which an Apple silicon artifact cache
      # does not have. The integration tests need an iPhone Duo simulator and
      # an iOS 27.1 runtime, which hosted runners do not have, so they stay a
      # local step -- see doc/manual-tests.md.
      - name: Build
        run: flutter build ios --no-codesign --debug
        working-directory: example

      # The plugin's Swift tests, which run against the real native
      # implementation on a simulator. Until 1.0.0 the only Swift test in the
      # repo was the untouched Flutter template -- it called a method this
      # plugin does not implement and would have crashed on its force-cast,
      # and nothing ever ran it. So the entire iOS native side was compiled
      # but never executed.
      #
      # An iPhone Duo simulator and an iOS 27.1 runtime are not available on
      # hosted runners, so these assert payload shape and the rules that hold
      # on any device -- including that no capability claims support while the
      # fold itself is unestablished, which is exactly what a non-foldable
      # simulator can prove.
      # Deliberately unpiped. Piping xcodebuild through a formatter hands the
      # step the formatter's exit code, which is how a failing test run can
      # report success -- it happened while writing these tests.
      - name: Test the Swift plugin
        run: >
          xcodebuild test
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:RunnerTests
          -quiet
        working-directory: example
